# ==============================================================================
#  🏔️ Everest CMI Custom Aliases Configuration
# ==============================================================================

CustomAlias:
  # Server initialization batch
  initWildy:
    Cmds:
      - gamerule world announceAdvancements false
      - gamerule world spectatorsGenerateChunks false
      - gamerule world_nether announceAdvancements false
      - gamerule world_nether spectatorsGenerateChunks false
      - gamerule world_the_end announceAdvancements false
      - gamerule world_the_end spectatorsGenerateChunks false
      - papi ecloud download GriefPrevention
      - papi ecloud download Server
      - papi reload
    Perm: true
    Tab: false

  # ----------------------------------------------------------------------------
  # 🏔️ Main Menu Dialog Aliases
  # ----------------------------------------------------------------------------
  menu:
    Cmds:
      - asConsole! cmi dialogs menu [playerName]
    Tab: true
  메뉴:
