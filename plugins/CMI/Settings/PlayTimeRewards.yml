# ==============================================================================
#  🏔️ Everest PlayTime Rewards Configuration
# ==============================================================================

# RECURRING REWARDS (PayEvery)
# These rewards are automatically given to players every 'X' seconds of online time.

hourly_patrol:
  DisplayName: "&aHourly Activity Bonus"
  AutoClaim: true
  Description:
    - "&fA small reward for staying active on the server."
    - "&fYou'll receive a little cash bonus!"
  PayEvery: 3600
  Commands:
    - asConsole! cmi money give [playerName] 25

daily_login:
  DisplayName: "&eDaily Login Bonus"
  AutoClaim: true
  Description:
    - "&fYour reward for logging in and being active for 24 hours."
    - "&fA generous boost to your wallet!"
  PayEvery: 86400
  Commands:
    - asConsole! cmi money give [playerName] 100

# PLAYTIME MILESTONE REWARDS (PayFor)
# One-time rewards given to players when their total online time reaches a specific duration.

milestone_1_hour:
  DisplayName: "&bFirst Hour Reward"
  AutoClaim: false
  Description:
    - "&fYou've been online for one hour!"
    - "&fClaim your first playtime milestone reward."
  PayFor: 3600
  Commands:
    - asConsole! cmi money give [playerName] 100

milestone_6_hours:
  DisplayName: "&b6-Hour Veteran"
  AutoClaim: false
  Description:
    - "&fCongratulations on 6 hours of playtime!"
    - "&fClaim your reward."
  PayFor: 21600
  Commands:
    - asConsole! cmi money give [playerName] 300

milestone_12_hours:
  DisplayName: "&dHalf-Day Hero"
  AutoClaim: false
  Description:
    - "&fYou've been online for half a day!"
    - "&fClaim your valuable milestone reward."
  PayFor: 43200
  Commands:
    - asConsole! cmi money give [playerName] 600

milestone_24_hours:
  DisplayName: "&6Full Day Survivor"
  AutoClaim: false
  Description:
    - "&fAn entire day of playtime! You've earned this."
    - "&fClaim your 24-hour survivor reward."
  PayFor: 86400
  Commands:
    - asConsole! cmi money give [playerName] 1500

milestone_7_days:
  DisplayName: "&c7-Day Champion"
  AutoClaim: false
  Description:
    - "&fYour commitment is incredible!"
    - "&fClaim your 1-week champion reward."
  PayFor: 604800
  Commands:
    - asConsole! cmi money give [playerName] 5000

milestone_30_days:
  DisplayName: "&530-Day Legend"
  AutoClaim: false
  Description:
    - "&fA full month! This is a massive achievement."
    - "&fClaim the legendary survivor reward."
  PayFor: 2592000
  Commands:
    - asConsole! cmi money give [playerName] 20000
